<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <h1 class="mb-4 text-center">Editar petición</h1>

            @if (errorMessage()) {
                <div class="alert alert-danger">{{ errorMessage() }}</div>
            }

            <form [formGroup]="itemForm" (ngSubmit)="onSubmit()">

                <div class="mb-3">
                    <label class="form-label">Título</label>
                    <input formControlName="title" type="text" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Descripción</label>
                    <textarea formControlName="description" class="form-control" rows="6" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Dirigida a</label>
                    <input formControlName="destinatary" type="text" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Categoría</label>
                    <select formControlName="category" class="form-select" required>
                        @for (cat of categories; track cat.id) {
                            <option [value]="cat.id">{{ cat.name }}</option>
                        }
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Imagen (opcional)</label>
                    <input type="file" (change)="onFileSelected($event)" class="form-control" accept="image/*">

                    @if (petition && petition.files && petition.files.length > 0) {
                        <div class="mt-2">
                            <p class="mb-1 text-muted small">Imágenes actuales:</p>
                            <div class="d-flex flex-wrap gap-2">
                                @for (file of petition.files; track file.id) {
                                    <div class="text-center">
                                        <img [src]="getImageUrl(file)"
                                            class="rounded border petition-thumb"
                                            alt="Imagen de la petición">
                                        <div class="mt-1">
                                            <button type="button" class="btn btn-outline-danger btn-sm" (click)="removeImage(file)">
                                                Quitar
                                            </button>
                                        </div>
                                    </div>
                                }
                            </div>
                        </div>
                    }
                </div>

                <div class="d-flex justify-content-end mt-3">
                    <a routerLink="/petitions" class="btn btn-secondary me-2">Cancelar</a>
                    <button type="submit" [disabled]="itemForm.invalid || loading()" class="btn btn-danger">
                        @if (loading()) { Guardando... } @else { Guardar cambios }
                    </button>
                </div>

            </form>

        </div>
    </div>
</div>
