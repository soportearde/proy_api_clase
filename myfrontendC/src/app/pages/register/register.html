<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-sm p-4" style="min-width: 360px;">

        <h2 class="text-center mb-4">Crear cuenta</h2>

        @if (errorMessage) {
            <div class="alert alert-danger">{{ errorMessage }}</div>
        }

        <form autocomplete="off" (ngSubmit)="register()">

            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" [(ngModel)]="formData.name" name="name"
                       class="form-control" required autofocus>
            </div>

            <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <input autocomplete="new-email" type="email" [(ngModel)]="formData.email" name="email"
                       class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input autocomplete="new-password" type="password" [(ngModel)]="formData.password" name="password"
                       class="form-control" required>
            </div>

            <button type="submit" class="btn btn-danger w-100">Registrarse</button>

        </form>

        <div class="text-center mt-3">
            <a routerLink="/login" class="text-muted small">¿Ya tienes cuenta? Inicia sesión</a>
        </div>

    </div>
</div>
