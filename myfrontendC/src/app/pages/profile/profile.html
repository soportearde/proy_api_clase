<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            @if (user$ | async; as user) {
                <div class="card shadow-sm p-4">

                    <h2 class="fw-bold mb-4">Mi perfil</h2>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Nombre</label>
                        <p class="form-control-plaintext">{{ user.name }}</p>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Correo electrónico</label>
                        <p class="form-control-plaintext">{{ user.email }}</p>
                    </div>

                    <div class="d-flex gap-2 flex-wrap">
                        <a routerLink="/mypetitions" class="btn btn-outline-secondary">Mis peticiones</a>
                        <a routerLink="/mysigns" class="btn btn-outline-secondary">Mis firmas</a>
                        <button type="button" (click)="logout()" class="btn btn-danger">Cerrar sesión</button>
                    </div>

                </div>
            } @else {
                <div class="text-center">
                    <div class="spinner-border text-danger" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </div>
                </div>
            }

        </div>
    </div>
</div>
